<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="csrf-token" content="DsjQRoIArlk5t7TtvXQIuKT0UwVg9mv5rEjwomUP">
  <title>Meme Orbit - Bitcoin Payment Details</title>

  <link rel="stylesheet" href="../asset/theme3/frontend/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../asset/theme3/frontend/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../asset/theme3/frontend/vendor/boxicons/css/boxicons.min.css">
  <link rel="stylesheet" href="../asset/theme3/frontend/css/style.css">
  <link rel="stylesheet" href="../asset/theme3/frontend/css/iziToast.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">

  <style>
    .error,
    .success {
      margin-top: 10px;
      font-size: 16px;
      text-align: center;
      text-transform: capitalize;
    }

    .error {
      color: rgb(207, 22, 22);
    }

    .success {
      color: rgb(12, 56, 12);
    }

    .site-card {
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
    }

    .card-header h5 {
      font-weight: bold;
      color: #333;
    }

    .list-group-item {
      background: transparent;
      border: none;
      padding: 15px 10px;
      font-size: 16px;
    }

    .form-control {
      font-size: 16px;
    }

    @media (max-width: 576px) {
      .list-group-item span {
        font-size: 14px;
      }

      .btn {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header id="header" class="fixed-top header-inner-pages">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <div class="logo me-auto">
        <a href="../dashboard/dashboard.html">
          <img src="../asset/theme3/images/logo/MEMEORBIT LOGO_122256.png" class="img-fluid rounded" width="100%" alt="Meme Orbit Logo">
        </a>
      </div>
      <div id="google_translate_element"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,es,fr,de,pt,ru,zh-CN,ja,ar,it,nl,ko,tr,sv,pl,id,el,da,no,fi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          }, 'google_translate_element');
        }
      </script>
      <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" type="text/javascript"></script>
    </div>
  </header>

  <main id="main" class="dashboard-main">
    <section class="dashboard-section">
      <div class="dashboard-body-part">
        <div class="mobile-page-header">
          <h5 class="title">Payment Information</h5>
          <a href="../dashboard/dashboard.html" class="back-btn"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="row gy-4">
          <div id="errorMsg" class="error"></div>
          <div id="successMsg" class="success"></div>

          <div class="col-xl-6">
            <div class="site-card">
              <div class="card-header">
                <h5 class="mb-0">Payment Details</h5>
              </div>

              <div class="card-body">
                <ul class="list-group">
                  <li class="list-group-item">
                    <div class="input-group">
                      <input type="text" id="refer-link" class="form-control" value="bc1qr3tklzp333dsd3qfnyl3gqk9dfk8skl8gmhcvt" readonly>
                      <button type="button" class="btn btn-outline-primary" id="copy-address">Copy</button>
                    </div>
                  </li>

                  <li class="list-group-item d-flex justify-content-between">
                    <span>Gateway Name:</span>
                    <span>Bitcoin</span>
                  </li>

                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Amount:</span>
                    <span><strong id="depositAmt">0.00</strong> BTC</span>
                  </li>

                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Amount in USD:</span>
                    <span><strong id="equAmt">0.00</strong> USD</span>
                  </li>

                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Charge:</span>
                    <span>0.00 BTC</span>
                  </li>

                  <li class="list-group-item text-center">
                    <button class="btn btn-primary w-100" type="button" onclick="btcDeposit()">Deposit Now</button>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../scripts/main.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js"></script>
  <script src="../scripts/loadBtcConfirmationPage.js"></script>

  <script>
    document.getElementById("copy-address").addEventListener("click", function () {
      const address = document.getElementById("refer-link").value;

      navigator.clipboard.writeText(address)
        .then(() => {
          iziToast.success({
            title: 'Copied!',
            message: 'Wallet address copied to clipboard.',
            position: 'topRight',
            timeout: 2500
          });
        })
        .catch(err => {
          iziToast.error({
            title: 'Error',
            message: 'Failed to copy address.',
            position: 'topRight'
          });
          console.error("Failed to copy: ", err);
        });
    });
  </script>

</body>

</html>
