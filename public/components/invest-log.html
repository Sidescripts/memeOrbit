<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        body {
            background-color: #f9fafc;
        }
        .table thead th {
            background: linear-gradient(45deg, #00367A, #0086B2);
            color: #fff;
            text-transform: uppercase;
            font-size: 13px;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f4f7fb;
        }

        .table td,
        .table th {
            text-align: center;
            vertical-align: middle;
        }

        @media (max-width: 576px) {
            .table-responsive {
                overflow-x: auto;
            }

            table thead {
                display: none;
            }

            table tbody tr {
                display: block;
                margin-bottom: 1rem;
                border: 1px solid #ddd;
                border-radius: 6px;
                padding: 10px;
            }

            table tbody tr td {
                display: flex;
                justify-content: space-between;
                padding: 6px 0;
                border-bottom: none;
            }

            table tbody tr td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #00367A;
            }
        }
        .loading {
  text-align: center;
  padding: 20px;
  color: #6C9BCF;
}

.error {
  text-align: center;
  padding: 20px;
  color: #FF0060;
}

.error button {
  background: #6C9BCF;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  margin-left: 10px;
  cursor: pointer;
}

.status-approved {
  color: #1B9C85;
  font-weight: bold;
}

.status-pending {
  color: #F7D060;
  font-weight: bold;
}

.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 3px solid rgba(108, 155, 207, 0.3);
  border-radius: 50%;
  border-top-color: #6C9BCF;
  animation: spin 1s ease-in-out infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
    </style>
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Investment History</h2>
        <div class="table-responsive">
            <table class="table table-striped" id="investment-table">
                <thead>
                    <tr>
                        <th>Investment ID</th>
                        <th>Duration</th>
                        <th>Plan</th>
                        <th>Amount</th>
                        <th>Investment Date</th>
                        <th>ROI</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="investment-table-body">
                    <tr>
                        <td colspan="7" class="text-center">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous">
    </script>
    <script src="../scripts/main.js"></script>
    <script src="../scripts/invest-history.js"></script>
</body>

</html>
