<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment History</title>
    <!-- Use a single Bootstrap 5.3.2 import -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            background-color: #f9fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Table Styles */
        .investment-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .investment-table thead tr {
            background: linear-gradient(45deg, #00367A, #0086B2);
            color: #ffffff;
            text-align: left;
            text-transform: uppercase;
            font-size: 13px;
        }

        .investment-table th,
        .investment-table td {
            padding: 12px 15px;
            text-align: center;
            vertical-align: middle;
        }

        .investment-table tbody tr {
            border-bottom: 1px solid #dddddd;
            transition: all 0.2s ease;
        }

        .investment-table tbody tr:nth-of-type(even) {
            background-color: #f4f7fb;
        }

        .investment-table tbody tr:hover {
            background-color: #e3f2fd;
            cursor: pointer;
        }

        /* Status Badges */
        .status-completed {
            color: #2e7d32;
            background-color: #e8f5e9;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-active,
        .status-ongoing {
            color: #1565c0;
            background-color: #e3f2fd;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-pending {
            color: #f57f17;
            background-color: #fff8e1;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-failed {
            color: #c62828;
            background-color: #ffebee;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Button Styles */
        .btn-primary {
            background-color: #3f51b5;
            color: white;
        }

        .btn-primary:hover {
            background-color: #303f9f;
        }

        .btn-secondary {
            background-color: #607d8b;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #455a64;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #3f51b5;
            color: #3f51b5;
        }

        .btn-outline:hover {
            background-color: #e3f2fd;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8em;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 700px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #333;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        /* Detail View Styles */
        .detail-row {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            font-weight: 600;
            color: #555;
            min-width: 150px;
        }

        .detail-value {
            color: #333;
        }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 30px;
            color: #6C9BCF;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #c62828;
        }

        .error-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #c62828;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            margin-right: 10px;
        }

        .retry-btn {
            background-color: #3f51b5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            margin-left: 15px;
            cursor: pointer;
        }

        .retry-btn:hover {
            background-color: #303f9f;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3f51b5;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive Table */
        @media screen and (max-width: 768px) {
            .investment-table {
                border: 0;
            }

            .investment-table thead {
                display: none;
            }

            .investment-table tr {
                margin-bottom: 15px;
                display: block;
                border-bottom: 2px solid #ddd;
            }

            .investment-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding-left: 50%;
                position: relative;
                border-bottom: 1px dotted #ccc;
            }

            .investment-table td::before {
                content: attr(data-label);
                position: absolute;
                left: 15px;
                width: calc(50% - 15px);
                padding-right: 10px;
                font-weight: bold;
                text-align: left;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Investment History</h2>
        <div class="table-responsive">
            <table class="table table-striped investment-table" id="investment-table" role="grid" aria-describedby="investment-table-info">
                <thead>
                    <tr>
                        <th scope="col">Investment ID</th>
                        <th scope="col">Duration</th>
                        <th scope="col">Plan</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Investment Date</th>
                        <th scope="col">ROI</th>
                        <th scope="col">Status</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="investment-table-body">
                    <tr>
                        <td colspan="8" class="text-center">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    <!-- Combined script (assumes JavaScript is in invest-history.js) -->
    <script src="../scripts/main.js"></script>
    
    <script src="../scripts/invest-history.js"></script>
</body>

</html>
